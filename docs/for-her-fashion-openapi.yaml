        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /admin/auth/login:
    post:
      tags:
      - M01
      summary: Đăng nhập quản trị
      operationId: m01_post_admin_auth_login
      description: Chỉ cấp phiên quản trị cho tài khoản nội bộ hoạt động có quyền. Khách hàng bị từ chối.
      x-module: M01
      x-sequence-diagrams:
      - SD-17
      x-use-cases:
      - UC-A01
      x-roles:
      - PUBLIC
      responses:
        '200':
          description: Xử lý thành công.
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Mã truy vết.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthTokens'
                  traceId:
                    type: string
                    example: req-example-001
                required:
                - data
                - traceId
              example:
                data:
                  accessToken: access-token-example
                  refreshToken: refresh-token-example
                  tokenType: Bearer
                  expiresIn: 900
                  account:
                    id: '123'
                    fullName: Nguyễn An
                    role: ADMIN
                    status: ACTIVE
                    version: 3
                traceId: req-example-001
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              identifier: khach@example.com
              password: MatKhauMinhHoa!2026
  /admin/accounts:
    get:
      tags:
      - M01
      summary: Tra cứu tài khoản theo phạm vi quyền
      operationId: m01_get_admin_accounts
      description: Staff chỉ xem CUSTOMER. Yêu cầu role nội bộ từ Staff trả 403; backend luôn áp phạm vi.
      x-module: M01
      x-sequence-diagrams:
      - SD-19
      x-use-cases:
      - UC-A07
      x-roles:
      - ADMIN
      - STAFF
      responses:
        '200':
          description: Xử lý thành công.
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Mã truy vết.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Account'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
                    required:
                    - items
                    - pagination
                  traceId:
                    type: string
                    example: req-example-001
                required:
                - data
                - traceId
              example:
                data:
                  items: []
                  pagination:
                    page: 1
                    limit: 20
                    total: 0
                traceId: req-example-001
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: role
        in: query
        required: false
        schema:
          type: string
          enum:
          - CUSTOMER
          - STAFF
          - ADMIN
          example: CUSTOMER
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    post:
      tags:
      - M01
      summary: Tạo tài khoản nội bộ
      operationId: m01_post_admin_accounts
      description: Tạo tài khoản nội bộ
      x-module: M01
      x-sequence-diagrams:
      - SD-19
      x-use-cases:
      - UC-A07
      x-roles:
      - ADMIN
      responses:
        '201':
          description: Xử lý thành công.
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Mã truy vết.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Account'
                  traceId:
                    type: string
                    example: req-example-001
                required:
                - data
                - traceId
              example:
                data:
                  id: '123'
                  fullName: Nguyễn An
                  role: STAFF
                  status: ACTIVE
                  version: 3
                traceId: req-example-001
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
