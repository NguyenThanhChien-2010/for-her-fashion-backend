externalDocs:
  description: OpenAPI Specification 3.0.3
  url: https://spec.openapis.org/oas/v3.0.3
x-external-integrations:
  kiotviet:
    documentation: https://www.kiotviet.vn/huong-dan-su-dung-kiotviet/retail-ket-noi-api/public-api/
    module: M08
    baseUrl: https://public.kiotapi.com
    token:
      method: POST
      url: https://id.kiotviet.vn/connect/token
      contentType: application/x-www-form-urlencoded
      form:
        scopes: PublicApi.Access
        grant_type: client_credentials
        client_id: <KIOT_CLIENT_ID>
        client_secret: <KIOT_CLIENT_SECRET>
    headers:
      Retailer: <KIOT_RETAILER>
      Authorization: Bearer <access_token>
    resources:
    - method: GET
      path: /products
      purpose: Tra cứu SKU và tồn theo chi nhánh
      query:
        includeInventory: true
        pageSize: 100
        currentItem: 0
    - method: GET
      path: /customers
      purpose: Đối chiếu hồ sơ nguồn
    - method: POST
      path: /orders
      purpose: Gửi đơn đặt hàng đã đủ điều kiện
    - method: GET
      path: /orders/{id}
      purpose: Đối chiếu đơn nguồn
    - method: GET
      path: /invoices
      purpose: Đối chiếu hóa đơn, thu tiền và doanh số
    - method: GET
      path: /returns
      purpose: Đối chiếu chứng từ nhận trả hàng
    fieldMapping:
      Order.note: description
      OrderItem.sku: orderDetails[].productCode
      ProductVariant.kiotvietVariantId: orderDetails[].productId
    testOrder:
      description: Đơn Test - HKDN | Nhờ các chị không chuyển thành hóa đơn ạ.
      makeInvoice: false
    configuration:
    - KIOT_CLIENT_ID
    - KIOT_CLIENT_SECRET
    - KIOT_RETAILER
    - KIOT_BRANCH_ID
    accountVerification: Đã nhận thông tin kết nối. Retailer, chi nhánh, quyền và ánh xạ nguồn cần xác minh ở bước
      cấu hình. Tên kết nối forher chưa được dùng để suy ra Retailer.
    delivery: Adapter tiếp tục tích hợp hiện hành. Hết token lấy lại theo expires_in. Lỗi/timeout đẩy đơn phải đối
      chiếu mã nguồn trước khi gửi lại. Chỉ gửi đơn sau commit theo quy tắc COD/MoMo.
  momo:
    module: M07
    environment: sandbox
    baseUrl: https://test-payment.momo.vn
    configuration:
    - MOMO_PARTNER_CODE
    - MOMO_ACCESS_KEY
    - MOMO_SECRET_KEY
    - MOMO_IPN_URL
    - MOMO_REDIRECT_URL
    keyPortal: https://business.momo.vn/merchant/integrateInfo
    timeoutSeconds: 30
    contracts:
    - method: POST
      path: /v2/gateway/api/create
      requestType: captureWallet
      autoCapture: true
      fields:
      - partnerCode
      - requestId
      - orderId
      - amount
      - orderInfo
      - redirectUrl
      - ipnUrl
      - requestType
      - extraData
      - lang
      - signature
      resultFields:
      - resultCode
      - message
      - payUrl
      - orderId
      - requestId
      - amount
      - responseTime
      documentation: https://developers.momo.vn/v3/vi/docs/payment/api/wallet/onetime/
    - method: POST
      path: /v2/gateway/api/query
      fields:
      - partnerCode
      - requestId
      - orderId
      - lang
      - signature
      purpose: Tra cứu lần thanh toán gốc
      documentation: https://developers.momo.vn/v3/docs/payment/api/payment-api/query/
    - method: POST
      path: /v2/gateway/api/refund
      fields:
      - partnerCode
      - requestId
      - orderId
      - amount
      - transId
      - description
      - lang
      - signature
      purpose: Hoàn một phần/toàn phần theo duyệt Admin
      documentation: https://developers.momo.vn/v3/docs/payment/api/payment-api/refund/
    - method: POST
      path: /v2/gateway/api/refund/query
      fields:
      - partnerCode
      - requestId
      - orderId
      - lang
      - signature
      purpose: Tra cứu mã hoàn đã lưu
      documentation: https://developers.momo.vn/v3/docs/payment/api/payment-api/refund/
    authentication: Backend ký HMAC-SHA256 theo chuỗi trường của từng operation. Access key tham gia ký; secret
      key giữ riêng. JWT website không gửi sang MoMo.
    callback:
      websitePath: /api/v1/integrations/momo/ipn
