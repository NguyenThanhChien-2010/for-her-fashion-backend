openapi: 3.0.3
info:
  title: For Her Fashion - Website API Contract
  version: 1.0.2
servers:
- url: /api/v1
  description: Base path thiết kế; cấu hình host theo môi trường triển khai.
security:
- BearerAuth: []
tags:
- name: M01
  description: Tài khoản, phiên và phân quyền
- name: M02
  description: Danh mục, sản phẩm, biến thể và bảng số đo
- name: M03
  description: Tồn bán SKU và đối chiếu tồn
- name: M04
  description: Giỏ, yêu thích và phiên mua riêng
- name: M05
  description: Mã ưu đãi
- name: M06
  description: Đơn hàng và checkout
- name: M07
  description: Khoản thu, thanh toán và hoàn tiền
- name: M08
  description: Theo dõi tích hợp KiotViet
- name: M09
  description: Doanh số và chính sách thành viên
- name: M10
  description: Đánh giá
- name: M11
  description: Đổi trả
- name: M12
  description: Tư vấn đặt may
- name: M13
  description: Thông báo
- name: M14
  description: Báo cáo
- name: Shared
  description: Hạ tầng tệp dùng chung; không phải module nghiệp vụ mới
paths:
  /auth/register:
    post:
      tags:
      - M01
      summary: Đăng ký tài khoản khách hàng
      operationId: m01_post_auth_register
      description: Tạo Chờ xác thực, mã một lần hạn 24 giờ, mật khẩu băm; email lỗi không kích hoạt tài khoản.
      x-module: M01
      x-sequence-diagrams:
      - SD-01
      x-use-cases:
      - UC-01
      x-roles:
      - PUBLIC
      responses:
        '201':
          description: Xử lý thành công.
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Mã truy vết.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ActionResult'
                  traceId:
                    type: string
                    example: req-example-001
                required:
                - data
                - traceId
              example:
                data:
                  status: ACCEPTED
                  message: Yêu cầu đã được ghi nhận.
                traceId: req-example-001
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              fullName: Nguyễn An
              email: khach@example.com
              phone: 0901234567
              password: MatKhauMinhHoa!2026
  /auth/email-verifications/confirm:
    post:
      tags:
      - M01
      summary: Xác thực email
      operationId: m01_post_auth_email_verifications_confirm
      description: Kích hoạt và tiêu thụ mã trong cùng giao dịch; không tự đăng nhập.
      x-module: M01
      x-sequence-diagrams:
      - SD-01
      x-use-cases:
      - UC-01
      x-roles:
      - PUBLIC
      responses:
        '200':
          description: Xử lý thành công.
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Mã truy vết.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ActionResult'
                  traceId:
                    type: string
                    example: req-example-001
                required:
                - data
                - traceId
              example:
                data:
                  status: ACCEPTED
                  message: Yêu cầu đã được ghi nhận.
                traceId: req-example-001
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            example:
              token: one-time-token-example
  /auth/email-verifications/resend:
    post:
      tags:
      - M01
      summary: Gửi lại email xác thực
      operationId: m01_post_auth_email_verifications_resend
      description: Thông báo chung, giới hạn tần suất; mã mới vô hiệu mã cũ nếu tài khoản đủ điều kiện.
      x-module: M01
      x-sequence-diagrams:
      - SD-01
      x-use-cases:
      - UC-01
      x-roles:
      - PUBLIC
      responses:
        '202':
          description: Kết quả hợp lệ. 202 chỉ xác nhận đã tiếp nhận, không xác nhận nghiệp vụ ngoài thành công.
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Mã truy vết.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ActionResult'
                  traceId:
                    type: string
                    example: req-example-001
                required:
                - data
                - traceId
              example:
                data:
                  status: ACCEPTED
                  message: Yêu cầu đã được ghi nhận.
                traceId: req-example-001
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: khach@example.com
  /auth/login:
    post:
      tags:
      - M01
      summary: Đăng nhập khách hàng
      operationId: m01_post_auth_login
      description: Đăng nhập khách hàng
      x-module: M01
      x-sequence-diagrams:
      - SD-02
      x-use-cases:
      - UC-02
      x-roles:
      - PUBLIC
      responses:
        '200':
          description: Xử lý thành công.
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Mã truy vết.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthTokens'
                  traceId:
                    type: string
                    example: req-example-001
                required:
                - data
                - traceId
              example:
                data:
                  accessToken: access-token-example
                  refreshToken: refresh-token-example
                  tokenType: Bearer
                  expiresIn: 900
                  account:
                    id: '123'
                    fullName: Nguyễn An
                    role: CUSTOMER
                    status: ACTIVE
                    version: 3
                traceId: req-example-001
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              identifier: khach@example.com
              password: MatKhauMinhHoa!2026
  /auth/password/forgot:
    post:
      tags:
      - M01
      summary: Yêu cầu đặt lại mật khẩu
      operationId: m01_post_auth_password_forgot
      description: Luôn trả thông báo chung; mã một lần hạn 30 phút. Không tiết lộ email có tồn tại.
      x-module: M01
      x-sequence-diagrams:
      - SD-03
      x-use-cases:
      - UC-02
      x-roles:
      - PUBLIC
      responses:
        '202':
          description: Kết quả hợp lệ. 202 chỉ xác nhận đã tiếp nhận, không xác nhận nghiệp vụ ngoài thành công.
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Mã truy vết.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ActionResult'
                  traceId:
                    type: string
                    example: req-example-001
                required:
                - data
                - traceId
              example:
                data:
                  status: ACCEPTED
                  message: Yêu cầu đã được ghi nhận.
                traceId: req-example-001
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: khach@example.com
  /auth/password/reset:
    post:
      tags:
      - M01
      summary: Đặt mật khẩu mới
      operationId: m01_post_auth_password_reset
      description: Đổi mật khẩu, tiêu thụ mã và thu hồi phiên cũ trong cùng giao dịch; không tự mở khóa/đăng nhập.
      x-module: M01
      x-sequence-diagrams:
      - SD-03
      x-use-cases:
      - UC-02
      x-roles:
      - PUBLIC
      responses:
        '200':
          description: Xử lý thành công.
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Mã truy vết.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ActionResult'
                  traceId:
                    type: string
                    example: req-example-001
                required:
                - data
                - traceId
              example:
                data:
                  status: ACCEPTED
                  message: Yêu cầu đã được ghi nhận.
                traceId: req-example-001
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              token: one-time-token-example
              password: MatKhauMoi!2026
              passwordConfirmation: MatKhauMoi!2026
  /auth/refresh:
    post:
      tags:
      - M01
      summary: Làm mới phiên
      operationId: m01_post_auth_refresh
      description: Refresh token là thông tin xác thực trong body, không phải endpoint vô điều kiện. Xoay token,
        kiểm tra thu hồi/tài khoản khóa, không ghi token vào log.
      x-module: M01
      x-sequence-diagrams:
      - SD-02
      - SD-17
      x-use-cases:
      - UC-02
      - UC-A01
      x-roles:
      - PUBLIC
      responses:
        '200':
          description: Xử lý thành công.
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Mã truy vết.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthTokens'
                  traceId:
                    type: string
                    example: req-example-001
                required:
                - data
                - traceId
              example:
                data:
                  accessToken: access-token-example
                  refreshToken: refresh-token-example
                  tokenType: Bearer
                  expiresIn: 900
                  account:
                    id: '123'
                    fullName: Nguyễn An
                    role: CUSTOMER
                    status: ACTIVE
                    version: 3
                traceId: req-example-001
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: refresh-token-example
  /auth/logout:
    post:
      tags:
      - M01
      summary: Đăng xuất và thu hồi phiên
      operationId: m01_post_auth_logout
      description: Đăng xuất và thu hồi phiên
      x-module: M01
      x-sequence-diagrams:
      - SD-02
      - SD-17
      x-use-cases:
      - UC-02
      - UC-A01
      x-roles:
      - CUSTOMER
      - STAFF
      - ADMIN
      responses:
        '204':
          description: Thao tác đã hoàn tất; không có response body.
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /me:
    get:
      tags:
      - M01
      summary: Xem tài khoản hiện tại
      operationId: m01_get_me
      description: Xem tài khoản hiện tại
      x-module: M01
      x-sequence-diagrams:
      - SD-02
      x-use-cases:
      - UC-02
      x-roles:
      - CUSTOMER
      - STAFF
      - ADMIN
      responses:
        '200':
          description: Xử lý thành công.
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Mã truy vết.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Account'
                  traceId:
                    type: string
                    example: req-example-001
                required:
                - data
                - traceId
              example:
                data:
                  id: '123'
                  fullName: Nguyễn An
                  role: CUSTOMER
                  status: ACTIVE
                  version: 3
                traceId: req-example-001
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
