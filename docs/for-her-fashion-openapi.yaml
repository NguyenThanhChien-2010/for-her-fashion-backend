          type: integer
          minimum: 1
          maximum: 100
          default: 20
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token; backend kiểm tra phiên, khóa tài khoản và quyền hiện tại, không chỉ decode JWT.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
      description: Khóa do client tạo cho một ý định nghiệp vụ. Cùng chủ thể + operation + key + cùng payload trả
        kết quả cùng nghiệp vụ; khác payload trả 409 IDEMPOTENCY_KEY_REUSED. Khóa tài chính gắn với bản ghi bền
        vững, không chỉ TTL cache.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
        example: '"3"'
      description: Phiên bản resource đã đọc, dạng ETag có ngoặc kép; không khớp trả 409 VERSION_CONFLICT theo quy
        ước contract.
  schemas:
    Address:
      type: object
      properties:
        recipientName:
          type: string
          minLength: 1
          example: Nguyễn An
        phone:
          type: string
          pattern: ^\+?[0-9]{9,15}$
          example: 0901234567
        addressLine:
          type: string
          minLength: 1
          example: 12 Nguyễn Trãi, Phường Bến Thành, TP.HCM
      required:
      - recipientName
      - phone
      - addressLine
    Pagination:
      type: object
      properties:
        page:
          type: integer
          format: int64
          minimum: 1
          example: 1
        limit:
          type: integer
          format: int64
          minimum: 1
          example: 20
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
          example: 0
      required:
      - page
      - limit
      - total
    FieldError:
      type: object
      properties:
        field:
          type: string
          example: quantity
        message:
          type: string
          example: Số lượng phải là số nguyên dương.
      required:
      - field
      - message
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: INSUFFICIENT_STOCK
            message:
              type: string
              example: SKU không đủ tồn bán.
            details:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'
          required:
