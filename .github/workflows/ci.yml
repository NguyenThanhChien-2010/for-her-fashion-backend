name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-readiness:
    name: Repository readiness
    runs-on: ubuntu-latest
    outputs:
      has_application: ${{ steps.detect.outputs.has_application }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Detect application configuration
        id: detect
        shell: bash
        run: |
          if [[ -f package.json ]]; then
            echo "has_application=true" >> "$GITHUB_OUTPUT"
            echo "Backend application configuration found." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_application=false" >> "$GITHUB_OUTPUT"
            echo "Backend application is not initialized; application checks are skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  application-ci:
    name: Application checks
    runs-on: ubuntu-latest
    needs: repository-readiness
    if: ${{ needs.repository-readiness.outputs.has_application == 'true' }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: for_her_fashion_test
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uci -pci --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://ci:ci@localhost:3306/for_her_fashion_test
      JWT_SECRET: ci-only-secret-for-tests-not-for-production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npm run prisma:validate
      - name: Generate Prisma Client
        run: npm run prisma:generate
      - name: Apply database migrations
        run: npm run prisma:migrate:deploy
      - name: Lint (check only)
        run: npm run lint -- --no-fix
      - name: Build
        run: npm run build
      - name: Test
        run: npm test -- --runInBand
      - name: End-to-end test
        run: npm run test:e2e
